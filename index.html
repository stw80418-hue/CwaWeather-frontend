<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新北耶誕城</title>
    <link rel="icon" type="image/png" href="./candy-cane.png">
    <link rel="apple-touch-icon" href="./candy-cane.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./candy-cane.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>

        :root {
    --xmas-bg: radial-gradient(circle at top, #0f1a2b, #05080f);
    --xmas-red: #c93a3a;
    --xmas-green: #3bb78f;
    --xmas-gold: #f4d03f;
    --xmas-card: rgba(20, 30, 50, 0.85);
    --xmas-text: #e8f0ff;
    --xmas-soft: rgba(255, 255, 255, 0.12);
}
        :root {
            --ac-green: #7DE1A9;
            --ac-bg-pattern: #8FD8AF;
            --ac-cream: #FFFEF2;
            --ac-yellow: #F9F195;
            --ac-brown: #FFFFFF;
            --ac-blue: #4FB5D9;
            --ac-dark: #e8f0ff;
            --ac-card-border: #E6E0C8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--xmas-bg);
    min-height: 100vh;
    color: var(--xmas-text);
    overflow-x: hidden;
    padding-bottom: 20px;
    position: relative;
}
        /* 頂部狀態列 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

.location-pill {
    background: var(--xmas-red);
    color: white;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 900;
    font-size: 1.1rem;
    border: 1px solid var(--xmas-gold);
}

        .update-pill {
            font-size: 0.8rem;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            /* 限制在大手機寬度 */
            margin: 0 auto;
        }

        /* === 核心：今日焦點卡片 === */
.hero-card {
    background: var(--xmas-card);
    border-radius: 35px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(244, 208, 63, 0.18);
    border: 2px solid var(--xmas-soft);
    margin-bottom: 25px;
    position: relative;
    backdrop-filter: blur(10px);
}
        /* 像動森的對話氣泡 */
.hero-period {
    background: var(--xmas-green);
    color: white;
    padding: 6px 20px;
    border-radius: 20px;
    font-weight: bold;
    border: 1px solid var(--xmas-gold);
}

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .hero-icon {
            font-size: 5rem;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.1));
            animation: bounce 3s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .hero-temp {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--ac-brown);
            line-height: 1;
        }

        .hero-desc {
            font-size: 1.5rem;
            color: #8A7B70;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* === 上班族最愛的：快速建議區 === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #E0D8C0;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 20px;
        }

        .advice-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .advice-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--ac-brown);
            margin: 5px 0;
            line-height: 1.2;
        }

        /* === 稍後預報：橫向滑動區 === */
.section-title {
    font-size: 1.2rem;
    color: #5C93FA;
    margin-bottom: 15px;
    margin-left: 10px;
    font-weight: 900;
}

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            /* 隱藏滾動條但保留功能 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

.mini-card {
    min-width: 140px;
    background: rgba(15, 25, 45, 0.9);
    border-radius: 25px;
    padding: 20px 15px;
    text-align: center;
    border: 1px solid var(--xmas-soft);
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(255,255,255,0.05);
}
        .mini-time {
            background: var(--ac-green);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .mini-icon {
            font-size: 2.5rem;
            margin: 5px 0;
        }

        .mini-temp {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--ac-dark);
        }

        /* Loading 畫面 */
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

.loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(20, 30, 50, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* 確保最上層 */
}
body.loading .status-bar {
    display: none;
}
        body > *:not(#snow) {
    position: relative;
    z-index: 5;   /* ✅ 所有內容都在雪上面 */
}
#snow {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;   /* ✅ 雪在最底層 */
}
    </style>
</head>

<body>
    <canvas id="snow"></canvas>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; animation: bounce 2s infinite;">☁️</div>
        <p style="color: white; font-weight: bold; margin-top: 20px;">正在觀測雲的流動...</p>
    </div>
    <div class="status-bar">
        <div class="location-pill">📍 新北</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
        </div>

        <h3 class="section-title">稍後預報</h3>
        <div class="scroll-container" id="futureForecasts">
        </div>

    </div>

    <script>
        const API_URL = "https://weather-newtaipe.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            if (!weather) return "🌤️";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "⛅";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌤️";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🌂";
            let rainText = "不用帶傘";
            if (parseInt(rainProb) > 30) {
                rainIcon = "☂️";
                rainText = "記得帶傘！";
            }

            let clothIcon = "👕";
            let clothText = "舒適穿搭";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🎽";
                clothText = "短袖出發";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "加件外套";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">${period}</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">${current.weather}</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.rainIcon}</div>
                                    <div class="advice-text">${advice.rainText}</div>
                                    <div style="font-size:0.7rem; color:#999">降雨率 ${current.rain}</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.clothIcon}</div>
                                    <div class="advice-text">${advice.clothText}</div>
                                    <div style="font-size:0.7rem; color:#999">最高溫 ${current.maxTemp}°</div>
                                </div>
                            </div>
                        </div>
                    `;

            // 2. 渲染稍後預報 (包含明天判斷)
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            // 抓今天的日期數字 (例如 24)
            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);

                // 判斷該預報的日期是否跟今天不同，不同就是明天
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) {
                    p = "明天" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                                <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧${f.rain}</div>
                            </div>
                        `;
            });

            // 3. 右上角顯示今日日期
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));

                // 2. 定義「抓取資料」的工作
                const fetchPromise = fetch(API_URL).then(res => res.json());

                // 3. Promise.all 會等待「兩個都完成」才會往下走
                // result 陣列裡，第一個是 delay 的結果(沒用到)，第二個是 api 的 json 資料
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);

                    // 資料處理好後，隱藏 Loading，顯示主畫面
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗，狸克把網路線咬斷了！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
        const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

function resizeSnow() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeSnow();
window.addEventListener("resize", resizeSnow);

let snowflakes = [];

for (let i = 0; i < 180; i++) {
    snowflakes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 0.4,
        d: Math.random() + 0.3,
        o: Math.random() * 0.6 + 0.2
    });
}

function drawSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(255,255,255,0.8)";

    ctx.beginPath();
    for (let i = 0; i < snowflakes.length; i++) {
        let f = snowflakes[i];
        ctx.globalAlpha = f.o;
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
    }
    ctx.fill();
    updateSnow();
}

let angle = 0;

function updateSnow() {
    angle += 0.01;

    for (let i = 0; i < snowflakes.length; i++) {
        let f = snowflakes[i];
        f.y += Math.pow(f.d, 1.5);
        f.x += Math.sin(angle) * 0.3;

        if (f.y > canvas.height) {
            snowflakes[i] = {
                x: Math.random() * canvas.width,
                y: 0,
                r: f.r,
                d: f.d,
                o: f.o
            };
        }
    }
}

function animateSnow() {
    drawSnow();
    requestAnimationFrame(animateSnow);
}

animateSnow();
// 一進頁面就進入 loading 狀態
document.body.classList.add("loading");

async function fetchWeather() {
    try {
        const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));
        const fetchPromise = fetch(API_URL).then(res => res.json());

        const [_, json] = await Promise.all([delayPromise, fetchPromise]);

        if (json.success) {
            renderWeather(json.data);

            // ✅ 關閉 loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            // ✅ 這一行才是正確的「顯示 status bar」
            document.body.classList.remove("loading");
        } else {
            throw new Error("API Error");
        }
    } catch (e) {
        console.error(e);
        alert("天氣資料讀取失敗，狸克把網路線咬斷了！");
    }
}
    </script>
</body>
</html>
